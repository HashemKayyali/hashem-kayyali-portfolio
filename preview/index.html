<!doctype html>
<html lang="en" dir="ltr"><head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="index,follow" />
  <meta name="description" content="Hashem Kayyali — R&amp;D Product Engineer and Software Engineer working across software, embedded systems, IoT and hardware–software integration." />
  <title>Hashem Kayyali</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/fonts/v2-fonts.css" />
  <script>
    // Set the locale before CSS evaluation; Arabic never requests the V2 Latin fonts.
    const v2Segments = location.pathname.split('/').filter(Boolean);
    const v2Locale = v2Segments[v2Segments[1] === 'creative' ? 2 : 1] || new URLSearchParams(location.search).get('lang') || 'en';
    if (['en','ar','de','fr','es'].includes(v2Locale)) {
      document.documentElement.lang = v2Locale;
      document.documentElement.dir = v2Locale === 'ar' ? 'rtl' : 'ltr';
    }
    if (/^\/preview\/(creative\/)?(en|ar|de|fr|es)\/?$/.test(location.pathname)) {
      const project = document.createElement('link');project.rel='preload';project.as='image';
      project.href='/images/hashem-profile.webp';project.fetchPriority='high';document.head.append(project);
    }

  </script>
</head><body><div id="root"></div><script type="module" src="/preview/main.tsx"></script></body></html>
