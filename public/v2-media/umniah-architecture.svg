 <title id="title">Umniah YouthConnect — illustrative role and data architecture</title><desc id="desc">Illustration based on the approved project description: Flutter member workflows and authorized leader interfaces share Supabase operational data under role-based access. No internal screenshots or personnel records.</desc>
